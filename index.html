<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Muazzin.io - Accurate jamaat times for your local masjid">
    <title>Muazzin - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f3f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
            padding: 80px;
        }

        .left-section h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            color: #1a472a;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .left-section p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
        }

        .right-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
        }

        .mosque-icon {
            font-size: 120px;
            text-align: center;
            line-height: 280px;
        }

        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 60px 40px;
            }

            .left-section h1 {
                font-size: 2.5rem;
            }

            .right-section {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .content {
                padding: 40px 20px;
                gap: 30px;
            }

            .left-section h1 {
                font-size: 2rem;
            }

            .left-section p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="left-section">
                <h1>Accurate jamaat times for your local masjid</h1>
                <p>Never miss a prayer. Get real-time jamaat times delivered to your fingertips.</p>
            </div>
            <div class="right-section">
                <div class="icon-wrapper">
                    <div class="mosque-icon">🕌</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
